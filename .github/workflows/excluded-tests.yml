name: Excluded test suites

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  excluded-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          LEFTHOOK: 0
      - name: Run suites excluded from ordinary test selection
        env:
          SWIZ_NO_DAEMON: "1"
          AI_TEST_NO_BACKEND: "1"
        run: |
          TEST_FILES=$(bun scripts/get-test-scope.ts --excluded)
          if [ -z "$TEST_FILES" ]; then
            echo "ERROR: excluded test inventory is empty"
            exit 1
          fi
          echo "Excluded suites: $TEST_FILES"
          failed=0
          for test_file in $TEST_FILES; do
            echo "::group::$test_file"
            # Fresh processes prevent worker reuse from leaking suite state.
            # The outer timeout also catches hangs outside Bun's test timeout.
            if ! timeout --kill-after=10s 180s bun test --reporter=dots --parallel=1 --timeout=60000 "$test_file"; then
              echo "::error file=$test_file::Suite failed or timed out"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
