version: 2
updates:
  # Bun is the repository's package manager. GitHub currently supports Bun
  # version updates, but not security updates; see issue #874.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    assignees:
      - mherod
